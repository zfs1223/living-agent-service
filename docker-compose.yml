services:
  # ===========================================
  # Docker Socket Proxy - Docker API 安全代理
  # 用于数字员工执行代码时的安全隔离
  # 白名单限制：仅允许 CONTAINERS/EXEC/IMAGES/NETWORKS/VOLUMES
  # ===========================================
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: living-agent-docker-proxy
    hostname: docker-proxy
    environment:
      # 白名单：仅允许必要的 Docker API
      CONTAINERS: 1        # 允许创建/删除/查询容器
      EXEC: 1              # 允许在容器内执行命令
      IMAGES: 1            # 允许拉取镜像
      NETWORKS: 1          # 允许网络管理（创建隔离网络）
      VOLUMES: 1           # 允许卷管理
      POST: 1              # 允许白名单端点的写操作（创建网络/容器等）
      # 黑名单：禁止危险操作
      # 危险端点已通过 BUILD=0/SERVICES=0 等单独禁用
      # POST=1 仅对白名单端点（CONTAINERS/IMAGES/NETWORKS/VOLUMES）生效
      BUILD: 0             # 禁止构建镜像（防止恶意镜像）
      SERVICES: 0          # 禁止 Swarm 服务
      TASKS: 0             # 禁止 Swarm 任务
      PLUGINS: 0           # 禁止插件管理
      SECRETS: 0           # 禁止 Secrets 管理
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2375/_ping > /dev/null 2>&1 && echo 'healthy' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ===========================================
  # Living Agent Frontend - 前端服务
  # ===========================================
  living-agent-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: living-agent-frontend
    container_name: living-agent-frontend
    hostname: living-agent-frontend
    ports:
      - "8383:8383"
    networks:
      - frontend
    depends_on:
      living-agent-service:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ===========================================
  # Living Agent Service - 主服务
  # ===========================================
  living-agent-service:
    build:
      context: .
      dockerfile: living-agent-app/Dockerfile.local
    image: living-agent-service
    container_name: living-agent-service
    hostname: living-agent-service
    ports:
      - "8382:8382"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # 数据库连接
      - DATABASE_URL=jdbc:postgresql://postgres:5432/livingagent?charSet=UTF-8
      - DATABASE_USERNAME=livingagent
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be set}
      # Redis 连接
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Qdrant 连接
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Kafka 连接
      - KAFKA_ENABLED=${KAFKA_ENABLED:-true}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # 数据路径
      - LIVING_AGENT_DATA_PATH=/app/data
      - LIVING_AGENT_SKILLS_PATH=/app/skills
      # Docker Socket Proxy 配置（用于数字员工执行代码安全隔离）
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      # 架构文档路径 (Docker 环境下使用绝对路径，本地开发使用相对路径 ../docs)
      - LIVING_AGENT_DOCS_PATH=/app/workspace/docs
      - LIVING_AGENT_DOCUMENTS_PATH=/app/documents
      # 本地AI模型路径
      - AI_MODELS_PATH=/app/ai-models
      - PYTHON_SCRIPTS_PATH=/opt/python_scripts
      # 模型守护进程配置
      - SHERPA_MODEL_DIR=/app/ai-models/sherpa-ncnn/sherpa-ncnn-sense-voice-zh-en-ja-ko-yue-2025-09-09
      - QWEN3_MODEL_FILE=/app/ai-models/Qwen3-0.6B-GGUF/Qwen3-0.6B-Q8_0.gguf
      - QWEN35_MODEL_FILE=/app/ai-models/Qwen3.5-2B-GGUF/Qwen3.5-2B-Q4_K_M.gguf
      - MELOTTS_MODEL_DIR=/app/ai-models/MeloTTS
      # MeloTTS 语言配置 (内存不足时可跳过 jp: zh,en,fr,es,kr)
      - MELOTTS_LANGUAGES=${MELOTTS_LANGUAGES:-zh,en,fr,es,jp,kr}
      # 爬虫服务
      #- LIVING_AGENT_CRAWL4AI_URL=http://crawl4ai:11235
      # MemOS 记忆系统
      - MEMOS_BASE_URL=http://memos:8381
      - MEMOS_DEFAULT_CUBE_ID=living-agent
      # Claude CLI 代理配置
      - CLAUDE_CLI_PROXY_ENABLED=${CLAUDE_CLI_PROXY_ENABLED:-true}
      - CLAUDE_CLI_PROXY_BASE_URL=${CLAUDE_CLI_PROXY_BASE_URL:-http://living-agent-service:8382/api/v1/proxy/anthropic}
      - CLAUDE_CLI_PROXY_AUTH_TOKEN=${CLAUDE_CLI_PROXY_AUTH_TOKEN:-}
      - CLAUDE_CLI_PROXY_REQUIRE_AUTH=${CLAUDE_CLI_PROXY_REQUIRE_AUTH:-false}
      - CLAUDE_CLI_PROXY_DEFAULT_BRAIN=${CLAUDE_CLI_PROXY_DEFAULT_BRAIN:-tech}
      - CLAUDE_CLI_PROXY_STREAM_TIMEOUT=${CLAUDE_CLI_PROXY_STREAM_TIMEOUT:-600}
      - CLAUDE_CLI_PROXY_AUDIT_ENABLED=${CLAUDE_CLI_PROXY_AUDIT_ENABLED:-true}
      # Claude CLI 直接环境变量（供容器内直接使用 claude 命令）
      - ANTHROPIC_API_KEY=sk-living-agent-claude-proxy
      - ANTHROPIC_BASE_URL=http://living-agent-service:8382/api/v1/proxy/anthropic
      # Claude CLI MCP Server 配置
      - CLAUDE_CLI_MCP_ENABLED=${CLAUDE_CLI_MCP_ENABLED:-true}
      - CLAUDE_CLI_MCP_CONFIG_PATH=/app/config/claude/mcp.json
      # CodeGraph 语义代码索引配置
      - CODEGRAPH_ENABLED=${CODEGRAPH_ENABLED:-true}
      - CODEGRAPH_WATCH_DEBOUNCE_MS=${CODEGRAPH_WATCH_DEBOUNCE_MS:-5000}
      - CODEGRAPH_AUTO_SYNC=${CODEGRAPH_AUTO_SYNC:-true}
      # Brain ReAct 最大迭代次数 (默认10，复杂任务可设为20-30)
      - LIVINGAGENT_BRAIN_MAX_ITERATIONS=${LIVINGAGENT_BRAIN_MAX_ITERATIONS:-20}
      # 可选: 云端API (备用)
      # 声纹识别远程服务配置
      - SPEAKER_USE_REMOTE=false
      #- SPEAKER_SERVICE_URL=http://host.docker.internal:8390
      # RuView WiFi 感知服务配置
      - RUVIEW_POLLING_ENABLED=${RUVIEW_POLLING_ENABLED:-false}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      # - NOTION_API_KEY=${NOTION_API_KEY:-}
      # - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      # 天气API (可选，有免费wttr.in兜底)
      - WEATHER_QWEATHER_KEY=${WEATHER_QWEATHER_KEY:-}
      - WEATHER_OPENWEATHERMAP_KEY=${WEATHER_OPENWEATHERMAP_KEY:-}
      # 飞书配置
      - FEISHU_ENABLED=${FEISHU_ENABLED:-true}
      # application.yml 引用的是 FEISHU_ENTERPRISE_APP_ID，需正确映射
      # 兼容旧的 FEISHU_APP_ID 写法：优先使用 ENTERPRISE 变量，不存在时回退到通用变量
      - FEISHU_ENTERPRISE_APP_ID=${FEISHU_ENTERPRISE_APP_ID:-${FEISHU_APP_ID:-}}
      - FEISHU_ENTERPRISE_APP_SECRET=${FEISHU_ENTERPRISE_APP_SECRET:-${FEISHU_APP_SECRET:-}}
      - FEISHU_HR_APP_ID=${FEISHU_HR_APP_ID:-${FEISHU_APP_ID:-}}
      - FEISHU_HR_APP_SECRET=${FEISHU_HR_APP_SECRET:-${FEISHU_APP_SECRET:-}}
      - FEISHU_EMPLOYEE_APP_ID=${FEISHU_EMPLOYEE_APP_ID:-}
      - FEISHU_EMPLOYEE_APP_SECRET=${FEISHU_EMPLOYEE_APP_SECRET:-}
      - FEISHU_WEBHOOK_KEY=${FEISHU_WEBHOOK_KEY:-}
      # Jenkins 配置 (本地部署)
      - JENKINS_BASE_URL=http://jenkins:8080
      - JENKINS_USERNAME=${JENKINS_USERNAME:-}
      - JENKINS_API_TOKEN=${JENKINS_API_TOKEN:-}
      # GitLab 配置 (本地部署)
      - GITLAB_BASE_URL=http://gitlab:8929
      - GITLAB_ACCESS_TOKEN=${GITLAB_ACCESS_TOKEN:-}
      # Jira 配置 (备选，OpenProject 优先；如已有 Jira 实例可配置此项)
      - JIRA_BASE_URL=${JIRA_BASE_URL:-}
      - JIRA_EMAIL=${JIRA_EMAIL:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      # OpenProject 配置 (本地部署，免费替代 Jira，优先使用)
      - OPENPROJECT_BASE_URL=http://openproject:8080
      - OPENPROJECT_API_TOKEN=${OPENPROJECT_API_TOKEN:-}
      # Service Admin 配置（管理类工具开关）
      - SERVICE_ADMIN_ENABLED=${SERVICE_ADMIN_ENABLED:-false}
      # RuView WiFi 感知服务配置 (使用容器内部端口 3000)
      - RUVIEW_API_BASE_URL=http://ruview-sensing:3000
      - RUVIEW_POLLING_INTERVAL_SECONDS=${RUVIEW_POLLING_INTERVAL_SECONDS:-10}
    volumes:
      # 数据持久化（知识库/运行数据）
      - ./data:/app/data
      - ./logs:/app/logs
      # 文档型资料文件夹（本地可直接查看/编辑）
      - ./documents:/app/documents
      # 本地AI模型挂载 (关键! 挂载宿主机模型目录)
      # Windows: 设置 AI_MODELS_PATH=f:\SoarCloudAI\ai-models
      # Linux/Mac: 设置 AI_MODELS_PATH=/path/to/SoarCloudAI/ai-models
      - ${AI_MODELS_PATH:-../../ai-models}:/app/ai-models:ro
      # Python脚本挂载
      - ./scripts/python:/opt/python_scripts:ro
      # 技能目录挂载
      - ./living-agent-skill/src/main/resources/skills:/app/skills:ro
      # Claude MCP 配置挂载
      - ./living-agent-app/src/main/resources/claude/mcp.json:/app/config/claude/mcp.json:ro
      # 知识库/部门资料本地映射（可直接在宿主机查看）
      - ./data/knowledge:/app/data/knowledge
      - ./data/department-knowledge:/app/data/department-knowledge
      - ./data/personal-knowledge:/app/data/personal-knowledge
      # Docker socket — 已移除，避免容器逃逸风险
      # 如需容器管理功能，请使用 Docker Socket Proxy
      # - /var/run/docker.sock:/var/run/docker.sock
      # 源码工作区 (LLM 可读写项目源码)
      - ${WORKSPACE_PATH:-./..}:/app/workspace
      # 用户工作目录 (桌面客户端设置的本地保存路径，通过环境变量动态配置)
      # 设置 USER_WORKSPACE_PATH 环境变量来映射用户本地路径
      # 例如: USER_WORKSPACE_PATH=D:\app\living
      # 未设置时默认使用 ./data/user-workspace
      - ${USER_WORKSPACE_PATH:-./data/user-workspace}:/app/user-workspace
    networks:
      - frontend
      - backend
    depends_on:
      docker-socket-proxy:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8382/api/system/status > /dev/null 2>&1 && echo 'healthy' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

  # ===========================================
  # fuck-u-code - 代码质量分析与AI审查服务
  # 预构建镜像：image/living-agent-fuck-u-code.tar
  # AI模型使用模型守护进程(model_daemon.py)的 Qwen3.5-2B (端口8392)
  # 关联闭环: 49(代码审查工作流闭环) P49-C
  # ===========================================
  fuck-u-code:
    image: living-agent-fuck-u-code:latest
    container_name: living-agent-fuck-u-code
    hostname: fuck-u-code
    restart: unless-stopped
    environment:
      # AI模型配置 — 使用模型守护进程的 OpenAI 兼容端点（端口8392）
      FUCKUCODE_AI_PROVIDER: openai
      FUCKUCODE_AI_MODEL: qwen3.5-2b
      FUCKUCODE_AI_BASE_URL: http://living-agent-service:8392/v1
      FUCKUCODE_AI_API_KEY: ""
      # 输出语言
      FUCKUCODE_LOCALE: zh
      # 并发数（根据宿主机CPU调整）
      FUCKUCODE_CONCURRENCY: 4
    volumes:
      # 挂载项目源码（只读，用于分析）
      - ${WORKSPACE_PATH:-./..}:/workspace:ro
      # 持久化fuck-u-code配置缓存
      - fuck-u-code-cache:/home/node/.cache/fuck-u-code
    networks:
      - backend
    depends_on:
      living-agent-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node bin/fuck-u-code.js --version || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ===========================================
  # RuView Sensing - WiFi 物理感知服务
  # 基于 WiFi CSI 信号实现人员检测、占用统计、生命体征监测
  # 使用本地构建的镜像 (需先运行 docker build -f docker/Dockerfile.rust.nightly -t living-agent-ruview-sensing:nightly .)
  # ===========================================
  ruview-sensing:
    image: living-agent-ruview-sensing:nightly
    container_name: living-agent-ruview-sensing
    hostname: ruview-sensing
    ports:
      - "8387:3000"      # REST API (外部 8387 → 容器内部 3000)
      - "8389:3001"      # WebSocket (外部 8389 → 容器内部 3001)
      - "5005:5005/udp"  # ESP32 数据接收 (可选，硬件模式)
    environment:
      - RUST_LOG=info
      - CSI_SOURCE=${CSI_SOURCE:-simulated}
      - MODELS_DIR=/app/data/models
    volumes:
      - ruview-data:/app/data
      - ruview-models:/app/data/models
      - ../RuView/ui:/app/ui:ro  # 挂载本地 UI 目录以便实时更新
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ===========================================
  # Crawl4AI - 网页爬取辅助服务
  # ===========================================
  #crawl4ai:
    #image: unclecode/crawl4ai:latest
    #container_name: crawl4ai
  #  hostname: crawl4ai
  #  ports:
  #    - "11235:11235"
  #  environment:
      # 使用本地 Ollama 模型
  #    - LLM_PROVIDER=ollama/qwen2.5:latest
  #    - LLM_BASE_URL=http://192.168.0.249:2025/v1
  #    - LLM_TEMPERATURE=0.7
  #  volumes:
  #    - /dev/shm:/dev/shm
  #    - crawl4ai-cache:/home/appuser/.cache
  #  networks:
  #    - living-agent-network
  #  healthcheck:
  #    test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
  #    interval: 30s
  #    timeout: 10s
  #    retries: 3
  #    start_period: 60s
  #  restart: unless-stopped
  #  deploy:
  #    resources:
  #      limits:
  #        memory: 4G
  #      reservations:
  #        memory: 1G

  # ===========================================
  # Jenkins - CI/CD 持续集成服务
  # ===========================================
  jenkins:
    image: jenkins/jenkins:lts
    container_name: living-agent-jenkins
    hostname: jenkins
    ports:
      - "8384:8080"
      - "50000:50000"
    environment:
      - JENKINS_JAVA_OPTS=-Xms256m -Xmx512m
    volumes:
      - jenkins-home:/var/jenkins_home
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ===========================================
  # GitLab CE - 代码管理服务
  # ===========================================
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: living-agent-gitlab
    hostname: gitlab
    ports:
      - "8385:8929"
      - "2289:22"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2289
        puma['worker_processes'] = 0
        puma['min_threads'] = 2
        puma['max_threads'] = 4
        sidekiq['max_concurrency'] = 5
        postgresql['shared_buffers'] = '128MB'
        postgresql['max_worker_processes'] = 2
        nginx['worker_processes'] = 1
        prometheus_monitoring['enable'] = false
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8929/-/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # ===========================================
  # OpenProject - 项目管理服务 (免费开源，Jira 替代)
  # 从本地源码构建，无需拉取 Docker Hub 镜像
  # ===========================================
  openproject:
    build:
      context: ../openproject-17.3.1
      dockerfile: docker/prod/Dockerfile
      target: slim
      args:
        BIM_SUPPORT: "false"
        PGVERSION: "15"
    image: living-agent-openproject
    container_name: living-agent-openproject
    hostname: openproject
    ports:
      - "8386:8080"
    environment:
      - OPENPROJECT_HTTPS=false
      - OPENPROJECT_HOST__NAME=localhost:8386
      - OPENPROJECT_DEFAULT__LANGUAGE=zh-CN
      - DATABASE_URL=postgres://livingagent:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be set}@postgres:5432/openproject
      - OPENPROJECT_SECRET_KEY_BASE=${OPENPROJECT_SECRET:-livingagent-openproject-secret}
      - OPENPROJECT_RAILS__CACHE__STORE=file_store
      - RAILS_ENV=production
      - MIGRATE=true
    volumes:
      - openproject-data:/var/openproject/assets
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health_checks/default || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ===========================================
  # MemOS - 记忆系统 (可选，完整模式)
  # ===========================================
  memos:
    build:
      context: ../MemOS-2.0.7
      dockerfile: docker/Dockerfile
    image: living-agent-memos
    container_name: living-agent-memos
    hostname: memos
    ports:
      - "8381:8381"
    env_file:
      - ../MemOS-2.0.7/.env
    environment:
      - PYTHONPATH=/app/src
      - HF_ENDPOINT=https://hf-mirror.com
      - GRAPH_DB_BACKEND=neo4j-community
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://memos-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-memos123456}
      # Ollama 配置 (本地服务)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - MOS_LLM_BACKEND=ollama
      - MOS_LLM_MODEL=qwen3.5:2b
      - MOS_EMBEDDER_BACKEND=ollama
      - MOS_EMBEDDER_MODEL=nomic-embed-text:latest
      # Internet Retriever LLM 配置 (解决 reader.llm.model_name_or_path 为 None 的问题)
      - MEMRADER_MODEL=qwen3.5:2b
      - MEMRADER_API_BASE=http://host.docker.internal:11434/v1
      - MEMRADER_API_KEY=EMPTY
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - memos-src:/app/src
      - memos-data:/app/data
    networks:
      - backend
    depends_on:
      memos-neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/openapi.json > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G


  # ===========================================
  # MemOS Neo4j - 图数据库 (可选，完整模式)
  # ===========================================
  memos-neo4j:
    image: neo4j:5.26.4
    container_name: living-agent-memos-neo4j
    hostname: memos-neo4j
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-memos123456}
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - memos-neo4j-data:/data
      - memos-neo4j-logs:/logs
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
     # ===========================================
  # PostgreSQL - 企业知识存储
  # ===========================================
  postgres:
    image: pgvector/pgvector:pg15
    container_name: living-agent-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=livingagent
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be set}
      - POSTGRES_DB=livingagent
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livingagent"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped

  # ===========================================
  # Qdrant - 向量数据库
  # ===========================================
  qdrant:
    image: qdrant/qdrant:v1.15.3
    container_name: living-agent-qdrant
    hostname: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6333/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped

  # ===========================================
  # Redis - 分布式缓存
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: living-agent-redis
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    restart: unless-stopped

  # ===========================================
  # Zookeeper - Kafka 依赖
  # ===========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: living-agent-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - backend
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    restart: unless-stopped

  # ===========================================
  # Kafka - 神经元消息通讯
  # ===========================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: living-agent-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - backend
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

networks:
  frontend:
    driver: bridge
    name: living-agent-frontend
  backend:
    driver: bridge
    name: living-agent-backend

volumes:
  living-agent-data:
    name: living-agent-data
  living-agent-logs:
    name: living-agent-logs
  crawl4ai-cache:
    name: crawl4ai-cache
  postgres-data:
    name: living-agent-postgres-data
  qdrant-data:
    name: living-agent-qdrant-data
  redis-data:
    name: living-agent-redis-data
  # MemOS volumes
  memos-src:
    name: living-agent-memos-src
  memos-data:
    name: living-agent-memos-data
  memos-neo4j-data:
    name: living-agent-memos-neo4j-data
  memos-neo4j-logs:
    name: living-agent-memos-neo4j-logs
  # Kafka volumes
  zookeeper-data:
    name: living-agent-zookeeper-data
  zookeeper-logs:
    name: living-agent-zookeeper-logs
  kafka-data:
    name: living-agent-kafka-data
  # Jenkins volume
  jenkins-home:
    name: living-agent-jenkins-home
  # GitLab volumes
  gitlab-config:
    name: living-agent-gitlab-config
  gitlab-logs:
    name: living-agent-gitlab-logs
  gitlab-data:
    name: living-agent-gitlab-data
  # OpenProject volume
  openproject-data:
    name: living-agent-openproject-data
  # RuView volumes
  ruview-data:
    name: living-agent-ruview-data
  ruview-models:
    name: living-agent-ruview-models
  # fuck-u-code volume
  fuck-u-code-cache:
    name: living-agent-fuck-u-code-cache
