server:
  port: 8382

spring:
  application:
    name: living-agent-service
  profiles:
    active: dev
  
 
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/livingagent?charSet=UTF-8}
    username: ${DATABASE_USERNAME:livingagent}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: LivingAgentPool
  
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: living-agent-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    listener:
      auto-startup: ${KAFKA_ENABLED:true}
      concurrency: 3

logging:
  level:
    root: INFO
    com.livingagent: DEBUG
    # 降噪：高频非关键日志降为 INFO
    com.livingagent.core.employee.impl.DigitalEmployee: INFO
    com.livingagent.core.evolution: INFO
    com.livingagent.core.knowledge: INFO
    com.livingagent.gateway.service.FounderService: INFO

# ===========================================
# 本地AI模型配置 (参考dialogue-service)
# ===========================================
ai-models:
  # 模型根目录
  base-path: ${AI_MODELS_PATH:/app/ai-models}
  
  # ===========================================
  # Ollama 远程服务配置 (192.168.0.6:2025)
  # 可灵活切换模型，等 qwen3.5:27b 部署后直接修改 default-model 即可
  # ===========================================
  ollama:
    enabled: ${OLLAMA_ENABLED:true}
    base-url: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
    # 当前可用模型: qwen3.5:9b, qwen2.5:3b, qwen2.5:latest, deepseek-r1:14b, llama3.2:latest
    # 部署 qwen3.5:27b 后改为: qwen3.5:27b
    default-model: ${OLLAMA_DEFAULT_MODEL:qwen3.5:9b}
    timeout: ${OLLAMA_TIMEOUT:120000}
    models:
      - name: qwen3.5:9b
        enabled: true
        description: "Qwen3.5 9B - 当前主力模型"
        max-tokens: 4096
        temperature: 0.7
      - name: qwen2.5:3b
        enabled: true
        description: "Qwen2.5 3B - 轻量快速模型"
        max-tokens: 2048
        temperature: 0.7
      - name: qwen2.5:latest
        enabled: true
        description: "Qwen2.5 7.6B - 中等规模模型"
        max-tokens: 4096
        temperature: 0.7
      - name: deepseek-r1:1.5b
        enabled: true
        description: "DeepSeek R1 1.5B - 推理增强模型"
        max-tokens: 4096
        temperature: 0.7
      - name: llama3:8B
        enabled: true
        description: "Llama3 8B - Meta轻量模型"
        max-tokens: 2048
        temperature: 0.7
      - name: qwen2.5-coder:3b
        enabled: true
        description: "Qwen2.5 Coder 3B - 代码专用模型"
        max-tokens: 4096
        temperature: 0.3
      # 预留: qwen3.5:27b 部署后启用
      - name: qwen3.5:27b
        enabled: false
        description: "Qwen3.5 27B - 主大脑模型 (待部署)"
        max-tokens: 8192
        temperature: 0.7
  
  # LLM配置 - 本地模型
  llm:
    default-model: qwen3-0.6b
    models:
      - name: qwen3-0.6b
        type: local
        enabled: true
        model-path: ${AI_MODELS_PATH:/app/ai-models}/Qwen3-0.6B-GGUF/Qwen3-0.6B-Q8_0.gguf
        max-tokens: 2048
        temperature: 0.7
        python-script: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/llm/run_qwen3.py
      # Qwen3.5-2B - 默认工具神经元模型 (通过 Ollama)
      - name: qwen3.5-2b
        type: local
        enabled: true
        model-path: ${AI_MODELS_PATH:/app/ai-models}/Qwen3.5-2B-GGUF/Qwen3.5-2B-Q4_K_M.gguf
        max-tokens: 2048
        temperature: 0.7
        python-script: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/llm/run_qwen3.py
      # BitNet-1.58-3B - 资源受限场景备选
      
  
  # ASR配置 - 本地FunASR/Sherpa-NCNN
  asr:
    default-provider: sherpa-ncnn
    sample-rate: 16000
    channels: 1
    language: zh-CN
    providers:
      - name: sherpa-ncnn
        enabled: true
        model-path: ${AI_MODELS_PATH:/app/ai-models}/sherpa-ncnn/sherpa-ncnn-sense-voice-zh-en-ja-ko-yue-2025-09-09
        python-script: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/asr/run_sherpa_ncnn.py
      - name: funasr
        enabled: true
        model-path: ${AI_MODELS_PATH:/app/ai-models}/funasr/models
        python-script: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/asr/run_funasr.py
  
  # TTS配置 - 本地Kokoro/MeloTTS
  tts:
    default-provider: kokoro
    default-voice: zf_xiaobei
    default-speed: 1.0
    providers:
      - name: kokoro
        enabled: true
        model-path: ${AI_MODELS_PATH:/app/ai-models}/Kokoro/kokoro-v1_0.pth
        voices-path: ${AI_MODELS_PATH:/app/ai-models}/Kokoro/voices
        python-script: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/tts/run_kokoro.py
      - name: melotts
        enabled: true
        model-path: ${AI_MODELS_PATH:/app/ai-models}/MeloTTS
        languages: [zh, en, jp, kr, es, fr]
        python-script: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/tts/run_melotts.py
  
  # 声纹识别配置 - 本地CAM++或远程服务
  speaker-verification:
    enabled: true
    model-path: ${AI_MODELS_PATH:/app/ai-models}/cam/campplus_cn_en_common.pt
    threshold: 0.33
    python-script: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/speaker/speaker_verifier.py
    # 远程服务配置 (可选，用于独立部署)
    use-remote: ${SPEAKER_USE_REMOTE:false}
    remote-service-url: ${SPEAKER_SERVICE_URL:http://speaker-verification:8390}

# ===========================================
# Agent配置
# ===========================================
agent:
  defaults:
    provider: local
    model: qwen3-0.6b
    context-tokens: 8192
    timeout-seconds: 300
  fallback:
    enabled: false
  exec:
    host: true
    security: sandbox
    timeout-sec: 60

# ===========================================
# 工具开关配置
# ===========================================
tool:
  claude-cli:
    enabled: ${CLAUDE_CLI_ENABLED:false}
  openproject:
    base-url: ${OPENPROJECT_BASE_URL:}
    api-token: ${OPENPROJECT_API_TOKEN:}
  jira:
    base-url: ${JIRA_BASE_URL:}
    email: ${JIRA_EMAIL:}
    api-token: ${JIRA_API_TOKEN:}
    employee-accounts:
      T02: ${JIRA_TOKEN_T02:}
      C02: ${JIRA_TOKEN_C02:}
  gitlab:
    base-url: ${GITLAB_BASE_URL:}
    access-token: ${GITLAB_ACCESS_TOKEN:}
    employee-accounts:
      T01: ${GITLAB_TOKEN_T01:}
      T02: ${GITLAB_TOKEN_T02:}
      T03: ${GITLAB_TOKEN_T03:}
      T09: ${GITLAB_TOKEN_T09:}
      T10: ${GITLAB_TOKEN_T10:}
  jenkins:
    base-url: ${JENKINS_BASE_URL:}
    username: ${JENKINS_USERNAME:}
    api-token: ${JENKINS_API_TOKEN:}
    employee-accounts:
      T03: ${JENKINS_TOKEN_T03:}

# ===========================================
# Tool Neuron 模型选择配置
# ===========================================
tool-neuron:
  model:
    default: qwen3.5-2b
    auto-select: true
    memory-threshold-mb: 2048
    cpu-load-threshold: 0.8
    models:
      - id: qwen3.5-2b
        enabled: true
        description: "Qwen3.5-2B - 默认工具神经元模型"
        memory-mb: 4096
        context-length: 262144
        multimodal: true
        recommended: true
      - id: bitnet-1.58-3b
        enabled: true
        description: "BitNet-1.58-3B - 资源受限场景备选"
        memory-mb: 1024
        context-length: 4096
        multimodal: false
        recommended: false

# ===========================================
# 通道配置
# ===========================================
channels:
  perception:
    audio:
      id: channel://perception/audio
      type: UNICAST
    text:
      id: channel://perception/text
      type: UNICAST
    sensor:
      id: channel://perception/sensor-data
      type: BROADCAST
    sensor-alert:
      id: channel://perception/sensor-alert
      type: BROADCAST
  dispatch:
    tech:
      id: channel://tech/tasks
      type: ROUND_ROBIN
      max-concurrency: 5
    hr:
      id: channel://hr/tasks
      type: UNICAST
    fin:
      id: channel://fin/tasks
      type: UNICAST
    sal:
      id: channel://sal/tasks
      type: UNICAST
    cs:
      id: channel://cs/tasks
      type: UNICAST
    adm:
      id: channel://adm/tasks
      type: UNICAST
    leg:
      id: channel://leg/tasks
      type: UNICAST
    ops:
      id: channel://ops/tasks
      type: UNICAST
  output:
    text:
      id: channel://output/text
      type: BROADCAST
    speech:
      id: channel://output/speech
      type: UNICAST

# ===========================================
# Living Agent 核心配置
# ===========================================
living-agent:
  data:
    path: ${LIVING_AGENT_DATA_PATH:/app/data}
  memory:
    backend: ${MEMORY_PROVIDER:sqlite}
    memos:
      enabled: ${MEMOS_ENABLED:false}
      base-url: ${MEMOS_BASE_URL:http://memos:8381}
  knowledge:
    backend: sqlite
  brain:
    compact:
      enabled: true
      native-enabled: ${LIVING_AGENT_COMPACT_NATIVE_ENABLED:false}
      context-limit: 50000
      persist-dir: ${LIVING_AGENT_DATA_PATH:/app/data}/compact-outputs
  worktree:
    repo-root: ${LIVING_AGENT_DATA_PATH:/app/data}/repo
  professional-knowledge:
    enabled: ${PROFESSIONAL_KNOWLEDGE_ENABLED:true}
    agency-agents-path: ${AGENCY_AGENTS_PATH:/app/data/agency-agents}
  claude-cli:
    enabled: ${CLAUDE_CLI_ENABLED:true}
    command: claude
    workspace: ./agent_workspace
    default-output-format: stream-json
    dangerously-skip-permissions: true
    allowed-dirs:
      - ./agent_workspace
    max-concurrent-sessions: 3
    session-timeout-minutes: 30
    job-timeout-minutes: 60
    proxy:
      enabled: ${CLAUDE_CLI_PROXY_ENABLED:true}
      base-url: ${CLAUDE_CLI_PROXY_BASE_URL:http://localhost:8480/api/v1/proxy/anthropic}
      api-url: ${CLAUDE_CLI_PROXY_API_URL:http://localhost:8480/api/v1/proxy/anthropic/v1}
      api-key-placeholder: sk-living-agent-claude-proxy
      auth-token: ${CLAUDE_CLI_PROXY_AUTH_TOKEN:}
      require-auth: ${CLAUDE_CLI_PROXY_REQUIRE_AUTH:false}
      default-brain-id: ${CLAUDE_CLI_PROXY_DEFAULT_BRAIN:tech}
      default-department-id: ${CLAUDE_CLI_PROXY_DEFAULT_DEPT:tech}
      default-task-type: ${CLAUDE_CLI_PROXY_DEFAULT_TASK:code_generation}
      stream-timeout-seconds: ${CLAUDE_CLI_PROXY_STREAM_TIMEOUT:600}
      max-input-tokens: 120000
      max-output-tokens: 8192
      audit-enabled: ${CLAUDE_CLI_PROXY_AUDIT_ENABLED:true}
      push-stream-events: ${CLAUDE_CLI_PROXY_PUSH_EVENTS:true}
      virtual-model-mapping:
        claude-sonnet-4-20250514: balanced
        claude-sonnet-4: balanced
        claude-opus-4-20250514: powerful
        claude-opus-4: powerful
        claude-haiku-4-20250514: fast
        claude-haiku-4: fast


# ===========================================
# 记忆系统配置
# ===========================================
memory:
  enabled: true
  provider: ${MEMORY_PROVIDER:sqlite}
  # SQLite 配置 (本地缓存/兜底)
  sqlite:
    path: ${LIVING_AGENT_DATA_PATH:/app/data}/memory.db
  # MemPalace 配置 (实时记忆层 - 本地 stdio MCP)
  mempalace:
    enabled: ${MEMPALACE_ENABLED:false}
    palace-path: ${MEMPALACE_PATH:/app/data/palace}
    python-command: ${MEMPALACE_PYTHON:python}
    timeout-ms: 5000
  # MemOS 配置 (长期记忆层)
  memos:
    enabled: ${MEMOS_ENABLED:false}
    base-url: ${MEMOS_BASE_URL:http://memos:8381}
    timeout: 30000
    default-cube-id: ${MEMOS_DEFAULT_CUBE_ID:living-agent}
    user-id: ${MEMOS_USER_ID:living-agent-system}
  # 路由策略
  routing:
    realtime:
      provider: mempalace
      priority: HIGH
      timeout-ms: 100
    longterm:
      provider: memos
      priority: MEDIUM
      timeout-ms: 500
    fallback:
      provider: sqlite
      priority: LOW
      timeout-ms: 10
  # 同步配置
  sync:
    enabled: true
    interval-minutes: 60
    batch-size: 100
  # 查询配置
  query:
    max-results: 20
    min-score: 0.3

# ===========================================
# 安全配置
# ===========================================
security:
  autonomy-level: SUPERVISED
  workspace-dir: ${LIVING_AGENT_DATA_PATH:/app/data}/workspace
  workspace-only: true
  max-actions-per-hour: 100
  max-cost-per-day-cents: 0

# ===========================================
# 认证 Cookie 配置
# ===========================================
auth:
  cookie:
    # Secure 标志：生产环境必须为 true（仅 HTTPS 传输），开发环境可设为 false
    secure: ${AUTH_COOKIE_SECURE:true}

# ===========================================
# Python脚本路径配置
# ===========================================
python-scripts:
  asr: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/asr
  tts: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/tts
  llm: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/llm
  speaker: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/speaker

# ===========================================
# 技能配置
# ===========================================
skills:
  path: ${LIVING_AGENT_SKILLS_PATH:/app/skills}
  auto-discover: true
  core-skills:
    - tavily-search
    - find-skills
    - proactive-agent
    - weather

qdrant:
  host: ${QDRANT_HOST:localhost}
  port: 6333
  grpc-port: 6334
  api-key: ${QDRANT_API_KEY:}
  timeout: 30
  collection-prefix: living_agent_
  collections:
    knowledge: knowledge_vectors
    employee: employee_vectors
    experience: experience_vectors

vector:
  embedding:
    model: ${EMBEDDING_MODEL:bge-m3}
    dimension: 1024
    batch-size: 32

lifecycle:
  health-check-interval: 300000
  max-idle-time: 3600000
  auto-terminate: true

feishu:
  enabled: ${FEISHU_ENABLED:true}
  webhook-key: ${FEISHU_WEBHOOK_KEY:}
  enterprise:
    app-id: ${FEISHU_ENTERPRISE_APP_ID:}
    app-secret: ${FEISHU_ENTERPRISE_APP_SECRET:}
  hr:
    app-id: ${FEISHU_HR_APP_ID:}
    app-secret: ${FEISHU_HR_APP_SECRET:}
  employee:
    app-id: ${FEISHU_EMPLOYEE_APP_ID:}
    app-secret: ${FEISHU_EMPLOYEE_APP_SECRET:}

# ===========================================
# RuView WiFi 感知服务配置
# ===========================================
ruview:
  api:
    base-url: ${RUVIEW_API_BASE_URL:http://ruview-sensing:3000}
    timeout-ms: ${RUVIEW_API_TIMEOUT_MS:5000}
  polling:
    enabled: ${RUVIEW_POLLING_ENABLED:true}
    interval-seconds: ${RUVIEW_POLLING_INTERVAL_SECONDS:10}
  zones:
    meeting-room-a:
      id: zone-meeting-a
      name: "会议室A"
      max-occupancy: 10
    meeting-room-b:
      id: zone-meeting-b
      name: "会议室B"
      max-occupancy: 8
    open-office:
      id: zone-open-office
      name: "开放办公区"
      max-occupancy: 30
  alerts:
    fall-detection:
      enabled: true
      cooldown-seconds: 300
    over-capacity:
      enabled: true
    intrusion:
      enabled: true
