server:
  port: 8382
  # HTTP 请求头大小限制（解决 "Request header is too large" 问题）
  # Spring Boot 3.x 支持带单位配置，增大到 128KB 以适应大型 Cookie/Authorization header
  max-http-request-header-size: 128KB

spring:
  application:
    name: living-agent-service
  profiles:
    active: dev
  
  # 启用 CGLIB 代理，解决 @EventListener 方法不在接口中的问题
  # SelfGovernanceOrchestratorImpl.onCrossLoopEvent 等方法需要 CGLIB 代理
  aop:
    proxy-target-class: true
 
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/livingagent?charSet=UTF-8}
    username: ${DATABASE_USERNAME:livingagent}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: LivingAgentPool
  
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: living-agent-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    listener:
      auto-startup: ${KAFKA_ENABLED:true}
      concurrency: 3

brain:
  boundary:
    enabled: true
    consecutive-failures-threshold: 5
    audit-log-enabled: true
    audit-log-level: warn

logging:
  level:
    root: INFO
    com.livingagent: DEBUG
    # 降噪：高频非关键日志降为 INFO
    com.livingagent.core.employee.impl.DigitalEmployee: INFO
    com.livingagent.core.evolution: INFO
    com.livingagent.core.knowledge: INFO
    com.livingagent.gateway.service.FounderService: INFO

# ===========================================
# 本地AI模型配置
# ===========================================
ai-models:
  base-path: ${AI_MODELS_PATH:/app/ai-models}
  
  # ===========================================
  # Ollama 远程服务配置
  # 说明：模型池通过 BuiltinModelCatalog.discoverOllamaModels() API 动态发现
  #       已下载的模型，无需在此硬编码模型列表。
  #       调用模型时会明确指定模型名称，无可用模型时提示用户下载。
  # ===========================================
  ollama:
    enabled: ${OLLAMA_ENABLED:true}
    base-url: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
    timeout: ${OLLAMA_TIMEOUT:120000}
  
  # ===========================================
  # LLM 本地模型配置
  # 说明：Python 守护进程 (model_daemon.py) 通过环境变量配置模型路径：
  #       - QWEN3_MODEL_FILE=${AI_MODELS_PATH}/Qwen3-0.6B-GGUF/Qwen3-0.6B-Q8_0.gguf
  #       - QWEN35_MODEL_FILE=${AI_MODELS_PATH}/Qwen3.5-2B-GGUF/Qwen3.5-2B-Q4_K_M.gguf
  #       此配置仅作为文档参考，实际模型由守护进程管理。
  # ===========================================
  llm:
    default-model: qwen3-0.6b
  
  # ===========================================
  # ASR 配置 - 本地 Sherpa-NCNN / FunASR
  # ===========================================
  asr:
    default-provider: sherpa-ncnn
    sample-rate: 16000
    channels: 1
    language: zh-CN
    providers:
      - name: sherpa-ncnn
        enabled: true
        model-path: ${AI_MODELS_PATH:/app/ai-models}/sherpa-ncnn/sherpa-ncnn-sense-voice-zh-en-ja-ko-yue-2025-09-09
        python-script: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/asr/run_sherpa_ncnn.py
      
  
  # ===========================================
  # TTS 配置 - 本地 MeloTTS
  # 说明：Python 守护进程 (model_daemon.py) 使用 MeloTTS
  #       模型路径由环境变量 MELOTTS_MODEL_DIR 配置
  # ===========================================
  tts:
    default-provider: melotts
    default-voice: default
    default-speed: 1.0
    providers:
      - name: melotts
        enabled: true
        model-path: ${MELOTTS_MODEL_DIR:${AI_MODELS_PATH:/app/ai-models}/MeloTTS}
        languages: [zh, en, jp, kr, es, fr]
        python-script: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/tts/run_melotts.py
  
  # 声纹识别配置 - 本地CAM++或远程服务
  speaker-verification:
    enabled: true
    model-path: ${AI_MODELS_PATH:/app/ai-models}/cam/campplus_cn_en_common.pt
    threshold: 0.33
    python-script: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/speaker/speaker_verifier.py
    # 远程服务配置 (可选，用于独立部署)
    use-remote: ${SPEAKER_USE_REMOTE:false}
    remote-service-url: ${SPEAKER_SERVICE_URL:http://speaker-verification:8390}

# ===========================================
# Agent配置
# ===========================================
agent:
  defaults:
    provider: local
    model: qwen3-0.6b
    context-tokens: 8192
    timeout-seconds: 300
  fallback:
    enabled: false
  exec:
    host: true
    security: sandbox
    timeout-sec: 60

# ===========================================
# Service Admin 配置
# 说明：管理类工具（GitLabAdminTool/OpenProjectAdminTool/JenkinsAdminTool）
#       通过 ToolRegistry 权限机制区分，MainBrain 可访问，其他大脑不可访问。
#       默认不启用，需要手动设置 SERVICE_ADMIN_ENABLED=true
# ===========================================
service-admin:
  enabled: ${SERVICE_ADMIN_ENABLED:true}

# ===========================================
# 工具开关配置
# 说明：控制各工具是否注册到 ToolRegistry
# ===========================================
tool:
  # Claude CLI 工具开关
  # 注意：此配置与 living-agent.claude-cli.enabled 共用同一环境变量
  #       确保两者配置一致，否则 ClaudeCliTool 可能无法正常工作
  claude-cli:
    enabled: ${CLAUDE_CLI_ENABLED:true}
  openproject:
    base-url: ${OPENPROJECT_BASE_URL:}
    api-token: ${OPENPROJECT_API_TOKEN:}
  jira:
    base-url: ${JIRA_BASE_URL:}
    email: ${JIRA_EMAIL:}
    api-token: ${JIRA_API_TOKEN:}
    employee-accounts:
      T02: ${JIRA_TOKEN_T02:}
      C02: ${JIRA_TOKEN_C02:}
  gitlab:
    base-url: ${GITLAB_BASE_URL:}
    access-token: ${GITLAB_ACCESS_TOKEN:}
    employee-accounts:
      T01: ${GITLAB_TOKEN_T01:}
      T02: ${GITLAB_TOKEN_T02:}
      T03: ${GITLAB_TOKEN_T03:}
      T09: ${GITLAB_TOKEN_T09:}
      T10: ${GITLAB_TOKEN_T10:}
  jenkins:
    base-url: ${JENKINS_BASE_URL:}
    username: ${JENKINS_USERNAME:}
    api-token: ${JENKINS_API_TOKEN:}
    employee-accounts:
      T03: ${JENKINS_TOKEN_T03:}

# ===========================================
# Tool Neuron 模型选择配置
# ===========================================
tool-neuron:
  model:
    default: qwen3.5-2b
    auto-select: true
    memory-threshold-mb: 2048
    cpu-load-threshold: 0.8
    models:
      - id: qwen3.5-2b
        enabled: true
        description: "Qwen3.5-2B - 默认工具神经元模型"
        memory-mb: 4096
        context-length: 262144
        multimodal: true
        recommended: true

# ===========================================
# 通道配置
# ===========================================
channels:
  perception:
    audio:
      id: channel://perception/audio
      type: UNICAST
    text:
      id: channel://perception/text
      type: UNICAST
    sensor:
      id: channel://perception/sensor-data
      type: BROADCAST
    sensor-alert:
      id: channel://perception/sensor-alert
      type: BROADCAST
  dispatch:
    tech:
      id: channel://tech/tasks
      type: ROUND_ROBIN
      max-concurrency: 5
    hr:
      id: channel://hr/tasks
      type: UNICAST
    fin:
      id: channel://fin/tasks
      type: UNICAST
    sal:
      id: channel://sal/tasks
      type: UNICAST
    cs:
      id: channel://cs/tasks
      type: UNICAST
    adm:
      id: channel://adm/tasks
      type: UNICAST
    leg:
      id: channel://leg/tasks
      type: UNICAST
    ops:
      id: channel://ops/tasks
      type: UNICAST
  output:
    text:
      id: channel://output/text
      type: BROADCAST
    speech:
      id: channel://output/speech
      type: UNICAST

# ===========================================
# Living Agent 核心配置
# ===========================================
living-agent:
  data:
    path: ${LIVING_AGENT_DATA_PATH:/app/data}
  # R2: 连接注册表后端选择（memory=内存主+DB回退，jdbc=DB主+内存缓存）
  connection-registry:
    backend: ${CONNECTION_REGISTRY_BACKEND:memory}
  # 进化空间根目录（与 data/ 业务空间分离）
  living-dir: ${LIVING_AGENT_LIVING_DIR:./.living}
  memory:
    backend: ${MEMORY_PROVIDER:sqlite}
    memos:
      enabled: ${MEMOS_ENABLED:false}
      base-url: ${MEMOS_BASE_URL:http://memos:8381}
  knowledge:
    backend: sqlite
  brain:
    compact:
      enabled: true
      native-enabled: ${LIVING_AGENT_COMPACT_NATIVE_ENABLED:false}
      context-limit: 50000
      persist-dir: ${LIVING_AGENT_DATA_PATH:/app/data}/compact-outputs
  worktree:
    repo-root: ${LIVING_AGENT_DATA_PATH:/app/data}/repo
  professional-knowledge:
    enabled: ${PROFESSIONAL_KNOWLEDGE_ENABLED:true}
    agency-agents-path: ${AGENCY_AGENTS_PATH:/app/data/agency-agents}
  # 架构文档知识播种配置（让大脑"看到"自己的代码结构）
  architecture-knowledge:
    enabled: ${ARCHITECTURE_KNOWLEDGE_ENABLED:true}
    docs-path: ${LIVING_AGENT_DOCS_PATH:${LIVING_AGENT_PROJECT_ROOT:..}/docs}
    documents-path: ${LIVING_AGENT_DOCUMENTS_PATH:${LIVING_AGENT_PROJECT_ROOT:..}/documents}
    chunk-size: ${ARCHITECTURE_KNOWLEDGE_CHUNK_SIZE:2000}
  claude-cli:
    enabled: ${CLAUDE_CLI_ENABLED:true}
    command: claude
    workspace: ./agent_workspace
    default-output-format: stream-json
    dangerously-skip-permissions: true
    allowed-dirs:
      - ./agent_workspace
    max-concurrent-sessions: 10
    session-timeout-minutes: 30
    job-timeout-minutes: 60
    mcp-enabled: ${CLAUDE_CLI_MCP_ENABLED:true}
    mcp-config-path: ${CLAUDE_CLI_MCP_CONFIG_PATH:classpath:claude/mcp.json}
    codegraph:
      enabled: ${CODEGRAPH_ENABLED:true}
      command: ${CODEGRAPH_COMMAND:codegraph}
      watch-debounce-ms: ${CODEGRAPH_WATCH_DEBOUNCE_MS:5000}
      auto-sync: ${CODEGRAPH_AUTO_SYNC:true}
      exclude-patterns:
        - .env
        - credentials
        - secret
        - "*.key"
        - "*.pem"
        - "*.p12"
        - node_modules
        - .git
        - target
        - build
        - dist
    proxy:
      enabled: ${CLAUDE_CLI_PROXY_ENABLED:true}
      base-url: ${CLAUDE_CLI_PROXY_BASE_URL:http://localhost:8480/api/v1/proxy/anthropic}
      api-url: ${CLAUDE_CLI_PROXY_API_URL:http://localhost:8480/api/v1/proxy/anthropic/v1}
      api-key-placeholder: sk-living-agent-claude-proxy
      auth-token: ${CLAUDE_CLI_PROXY_AUTH_TOKEN:}
      require-auth: ${CLAUDE_CLI_PROXY_REQUIRE_AUTH:false}
      default-brain-id: ${CLAUDE_CLI_PROXY_DEFAULT_BRAIN:tech}
      default-department-id: ${CLAUDE_CLI_PROXY_DEFAULT_DEPT:tech}
      default-task-type: ${CLAUDE_CLI_PROXY_DEFAULT_TASK:code_generation}
      stream-timeout-seconds: ${CLAUDE_CLI_PROXY_STREAM_TIMEOUT:600}
      max-input-tokens: 120000
      max-output-tokens: 8192
      audit-enabled: ${CLAUDE_CLI_PROXY_AUDIT_ENABLED:true}
      push-stream-events: ${CLAUDE_CLI_PROXY_PUSH_EVENTS:true}
      virtual-model-mapping:
        claude-sonnet-4-20250514: balanced
        claude-sonnet-4: balanced
        claude-opus-4-20250514: powerful
        claude-opus-4: powerful
        claude-haiku-4-20250514: fast
        claude-haiku-4: fast


# ===========================================
# 记忆系统配置
# ===========================================
memory:
  enabled: true
  provider: ${MEMORY_PROVIDER:sqlite}
  # SQLite 配置 (本地缓存/兜底)
  sqlite:
    path: ${LIVING_AGENT_DATA_PATH:/app/data}/memory.db
  # MemPalace 配置 (实时记忆层 - 本地 stdio MCP)
  mempalace:
    enabled: ${MEMPALACE_ENABLED:false}
    palace-path: ${MEMPALACE_PATH:/app/data/palace}
    python-command: ${MEMPALACE_PYTHON:python}
    timeout-ms: 5000
  # MemOS 配置 (长期记忆层)
  memos:
    enabled: ${MEMOS_ENABLED:false}
    base-url: ${MEMOS_BASE_URL:http://memos:8381}
    timeout: 30000
    default-cube-id: ${MEMOS_DEFAULT_CUBE_ID:living-agent}
    user-id: ${MEMOS_USER_ID:living-agent-system}
  # 路由策略
  routing:
    realtime:
      provider: mempalace
      priority: HIGH
      timeout-ms: 100
    longterm:
      provider: memos
      priority: MEDIUM
      timeout-ms: 500
    fallback:
      provider: sqlite
      priority: LOW
      timeout-ms: 10
  # 同步配置
  sync:
    enabled: true
    interval-minutes: 60
    batch-size: 100
  # 查询配置
  query:
    max-results: 20
    min-score: 0.3

# ===========================================
# 安全配置
# ===========================================
security:
  autonomy-level: SUPERVISED
  workspace-dir: ${LIVING_AGENT_DATA_PATH:/app/data}/workspace
  workspace-only: true
  max-actions-per-hour: 100
  max-cost-per-day-cents: 0

# ===========================================
# 认证 Cookie 配置
# ===========================================
auth:
  cookie:
    # Secure 标志：生产环境必须为 true（仅 HTTPS 传输），开发环境可设为 false
    secure: ${AUTH_COOKIE_SECURE:true}

# ===========================================
# Python脚本路径配置
# ===========================================
python-scripts:
  asr: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/asr
  tts: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/tts
  llm: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/llm
  speaker: ${PYTHON_SCRIPTS_PATH:/opt/python_scripts}/speaker

# ===========================================
# 技能配置
# ===========================================
skills:
  path: ${LIVING_AGENT_SKILLS_PATH:/app/skills}
  auto-discover: true
  core-skills:
    - tavily-search
    - find-skills
    - proactive-agent
    - weather

skill:
  config:
    path: ${LIVING_AGENT_SKILLS_PATH:/app/skills}
  data:
    path: ${LIVING_AGENT_DATA_PATH:/app/data}/skills
  hotreload:
    enabled: ${SKILL_HOTRELOAD_ENABLED:true}
    watch:
      config: ${SKILL_HOTRELOAD_WATCH_CONFIG:false}

qdrant:
  host: ${QDRANT_HOST:localhost}
  port: 6333
  grpc-port: 6334
  api-key: ${QDRANT_API_KEY:}
  timeout: 30
  collection-prefix: living_agent_
  collections:
    knowledge: knowledge_vectors
    employee: employee_vectors
    experience: experience_vectors

vector:
  embedding:
    model: ${EMBEDDING_MODEL:bge-m3}
    dimension: 1024
    batch-size: 32

lifecycle:
  health-check-interval: 300000
  max-idle-time: 3600000
  auto-terminate: true

feishu:
  enabled: ${FEISHU_ENABLED:true}
  webhook-key: ${FEISHU_WEBHOOK_KEY:}
  enterprise:
    app-id: ${FEISHU_ENTERPRISE_APP_ID:}
    app-secret: ${FEISHU_ENTERPRISE_APP_SECRET:}
  hr:
    app-id: ${FEISHU_HR_APP_ID:}
    app-secret: ${FEISHU_HR_APP_SECRET:}
  employee:
    app-id: ${FEISHU_EMPLOYEE_APP_ID:}
    app-secret: ${FEISHU_EMPLOYEE_APP_SECRET:}

# ===========================================
# LiveKit 实时音视频会议配置
# 闭环: 67 会议管理 / 68 会议纪要自动化
# 改进项: P81 LiveKit 部署与会议基础
#
# 配置优先级: SystemConfigService(企业设置) > 环境变量 > 硬编码默认值
# 可通过 API 动态覆盖: PUT /api/system/config/livekit
# ===========================================
livekit:
  # LiveKit Server 地址（可通过企业设置 livekit.api-url 覆盖）
  api-url: ${LIVEKIT_URL:http://livekit:7880}
  # API Key（可通过企业设置 livekit.api-key 覆盖）
  api-key: ${LIVEKIT_API_KEY:las-livekit-api-key}
  # API Secret（可通过企业设置 livekit.api-secret 覆盖，生产环境务必修改）
  api-secret: ${LIVEKIT_API_SECRET:las-livekit-api-secret-change-me}
  webhook-secret: ${LIVEKIT_WEBHOOK_SECRET:${livekit.api-secret}}
  connect-timeout: 5000
  read-timeout: 10000

# ===========================================
# 会议日历同步配置 (P84, 闭环 67-D/44)
# ===========================================
meeting:
  calendar:
    # 主日历服务（只能选择一个主服务）
    primary: ${MEETING_CALENDAR_PRIMARY:local}  # local | feishu | wechat | dingtalk | outlook | none
    # 本地 iCal 导出路径（始终启用，作为兜底方案）
    local-storage-path: ${MEETING_CALENDAR_LOCAL_PATH:${LIVING_AGENT_DATA_PATH:./data}/calendars/}
    # 回退策略
    fallback:
      enabled: true
      order: local,feishu,wechat  # 回退优先级（逗号分隔）
    # 飞书日历同步（需要 feishu.enabled=true + app-id/secret 配置）
    feishu:
      calendar-id: ${MEETING_CALENDAR_FEISHU_CALENDAR_ID:primary}  # 飞书日历 ID，primary 为主日历
    # 企业微信日历同步（需要 meeting.calendar.wechat.enabled=true）
    wechat:
      enabled: ${MEETING_CALENDAR_WECHAT_ENABLED:false}
      corp-id: ${MEETING_CALENDAR_WECHAT_CORP_ID:}
      calendar-secret: ${MEETING_CALENDAR_WECHAT_CALENDAR_SECRET:}

# ===========================================
# RuView WiFi 感知服务配置
# ===========================================
# 注意：后台轮询已弃用（v2.0），请使用 SensorDataTool 按需查询
ruview:
  api:
    base-url: ${RUVIEW_API_BASE_URL:http://ruview-sensing:3000}
    timeout-ms: ${RUVIEW_API_TIMEOUT_MS:5000}
  # 轮询配置（已弃用 - 使用 SensorDataTool 替代）
  polling:
    enabled: false  # 强制禁用，不再支持后台轮询
    interval-seconds: ${RUVIEW_POLLING_INTERVAL_SECONDS:10}
  zones:
    meeting-room-a:
      id: zone-meeting-a
      name: "会议室A"
      max-occupancy: 10
    meeting-room-b:
      id: zone-meeting-b
      name: "会议室B"
      max-occupancy: 8
    open-office:
      id: zone-open-office
      name: "开放办公区"
      max-occupancy: 30
  alerts:
    fall-detection:
      enabled: true
      cooldown-seconds: 300
    over-capacity:
      enabled: true
    intrusion:
      enabled: true
