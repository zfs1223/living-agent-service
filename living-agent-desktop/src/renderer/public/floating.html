<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http: https: ws: wss:"
    />
    <title>任务中心</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        background: rgba(28, 28, 32, 0.96);
        color: #e8e8ea;
        font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
        font-size: 12px;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      #floating-root {
        display: flex;
        flex-direction: column;
        height: 100vh;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      #fb-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.25);
        -webkit-app-region: drag;
        cursor: default;
      }
      .fb-title { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
      .fb-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
      .fb-dot.on { background: #f5222d; box-shadow: 0 0 6px rgba(245, 34, 45, 0.6); }
      .fb-count {
        min-width: 18px; height: 18px; line-height: 18px; padding: 0 5px;
        border-radius: 9px; background: #f5222d; color: #fff;
        font-size: 11px; text-align: center;
      }
      .fb-actions { display: flex; gap: 2px; -webkit-app-region: no-drag; }
      .fb-actions button {
        background: transparent; border: none; color: #bbb;
        width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-size: 13px;
      }
      .fb-actions button:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
      #fb-body { flex: 1; overflow-y: auto; padding: 6px 8px; }
      .fb-status { padding: 10px; color: #888; text-align: center; }
      .fb-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
      .fb-task {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 6px; padding: 6px 8px;
      }
      .fb-task-head { display: flex; gap: 4px; margin-bottom: 4px; }
      .fb-badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; line-height: 16px; }
      .fb-task-body { display: flex; flex-direction: column; gap: 2px; }
      .fb-task-type { font-weight: 600; font-size: 12px; color: #fff; }
      .fb-task-desc { color: #ccc; font-size: 11px; line-height: 1.4; max-height: 28px; overflow: hidden; }
      .fb-task-meta { color: #888; font-size: 10px; }
      .fb-task-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
      .fb-reward { color: #faad14; font-weight: 600; font-size: 11px; }
      .fb-claim {
        background: #1890ff; color: #fff; border: none; border-radius: 4px;
        padding: 3px 10px; font-size: 11px; cursor: pointer;
      }
      .fb-claim:hover:not(:disabled) { background: #40a9ff; }
      .fb-claim:disabled { background: #444; color: #888; cursor: not-allowed; }
      #fb-body::-webkit-scrollbar { width: 6px; }
      #fb-body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="floating-root">
      <header id="fb-header">
        <div class="fb-title">
          <span class="fb-dot" id="fb-dot"></span>
          <span>任务中心</span>
          <span class="fb-count" id="fb-count">0</span>
        </div>
        <div class="fb-actions">
          <button id="fb-refresh" title="刷新" type="button">↻</button>
          <button id="fb-collapse" title="折叠/展开" type="button">▭</button>
          <button id="fb-close" title="关闭" type="button">✕</button>
        </div>
      </header>
      <main id="fb-body">
        <div id="fb-status" class="fb-status">加载中…</div>
        <ul id="fb-list" class="fb-list"></ul>
      </main>
    </div>
    <script src="./floating.js"></script>
  </body>
</html>
