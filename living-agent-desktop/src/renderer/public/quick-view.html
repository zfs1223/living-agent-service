<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http: https: ws: wss:"
    />
    <title>Quick View</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%;
        background: rgba(28, 28, 32, 0.96);
        color: #e8e8ea;
        font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
        font-size: 12px;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      #qv-root {
        display: flex; flex-direction: column; height: 100vh;
        border-radius: 8px; overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* 顶部栏 */
      #qv-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 6px 10px; background: rgba(0, 0, 0, 0.25);
        -webkit-app-region: drag; cursor: default;
      }
      .qv-dept-select {
        -webkit-app-region: no-drag;
        background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
        color: #e8e8ea; border-radius: 4px; padding: 2px 6px; font-size: 11px;
        cursor: pointer; outline: none;
      }
      .qv-dept-select:disabled { opacity: 0.5; cursor: not-allowed; }
      .qv-lock-icon { color: #faad14; margin-left: 4px; font-size: 11px; }
      .qv-header-right { display: flex; align-items: center; gap: 4px; -webkit-app-region: no-drag; }
      .qv-notification-dot {
        width: 8px; height: 8px; border-radius: 50%; background: #f5222d;
        display: none; cursor: pointer;
        box-shadow: 0 0 4px rgba(245, 34, 45, 0.6);
      }
      .qv-notification-dot.visible { display: inline-block; }
      .qv-btn {
        background: transparent; border: none; color: #bbb;
        width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-size: 13px;
      }
      .qv-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

      /* 消息区 */
      #qv-messages {
        flex: 1; overflow-y: auto; padding: 8px 10px;
        display: flex; flex-direction: column; gap: 8px;
      }
      .qv-msg {
        max-width: 90%; padding: 6px 10px; border-radius: 8px;
        font-size: 12px; line-height: 1.5; word-break: break-word;
      }
      .qv-msg.user {
        align-self: flex-end;
        background: #1890ff; color: #fff;
        border-bottom-right-radius: 2px;
      }
      .qv-msg.assistant {
        align-self: flex-start;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.08);
        border-bottom-left-radius: 2px;
      }
      .qv-msg.assistant code {
        background: rgba(255,255,255,0.1); padding: 1px 4px; border-radius: 3px;
        font-family: "Cascadia Code", Consolas, monospace; font-size: 11px;
      }
      .qv-msg.assistant pre {
        background: rgba(0,0,0,0.3); padding: 6px 8px; border-radius: 4px;
        overflow-x: auto; margin: 4px 0;
      }
      .qv-msg.assistant pre code { background: none; padding: 0; }
      .qv-empty {
        flex: 1; display: flex; align-items: center; justify-content: center;
        color: #666; font-size: 12px;
      }

      /* Trace 简要进度 */
      #qv-trace {
        display: none; padding: 4px 10px;
        background: rgba(0,0,0,0.15); border-top: 1px solid rgba(255,255,255,0.06);
        font-size: 10px; color: #999;
      }
      #qv-trace.visible { display: flex; align-items: center; gap: 6px; }
      .qv-trace-step { display: flex; align-items: center; gap: 3px; }
      .qv-trace-dot { width: 6px; height: 6px; border-radius: 50%; background: #555; }
      .qv-trace-dot.done { background: #52c41a; }
      .qv-trace-dot.running { background: #1890ff; animation: qv-pulse 1s infinite; }
      .qv-trace-dot.failed { background: #f5222d; }
      @keyframes qv-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
      .qv-trace-detail { color: #1890ff; cursor: pointer; margin-left: auto; }
      .qv-trace-detail:hover { text-decoration: underline; }

      /* 输入区 */
      #qv-input-area {
        padding: 8px 10px; background: rgba(0,0,0,0.2);
        border-top: 1px solid rgba(255,255,255,0.06);
        display: flex; flex-direction: column; gap: 6px;
      }
      .qv-attachments {
        display: flex; gap: 4px; flex-wrap: wrap;
      }
      .qv-attachment-chip {
        display: flex; align-items: center; gap: 3px;
        background: rgba(24,144,255,0.15); border: 1px solid rgba(24,144,255,0.3);
        border-radius: 4px; padding: 2px 6px; font-size: 10px; color: #91d5ff;
      }
      .qv-attachment-remove {
        cursor: pointer; color: #999; font-size: 11px;
      }
      .qv-attachment-remove:hover { color: #f5222d; }
      .qv-input-row {
        display: flex; align-items: center; gap: 6px;
      }
      #qv-input {
        flex: 1; background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12); border-radius: 6px;
        color: #e8e8ea; padding: 6px 10px; font-size: 12px; outline: none;
        -webkit-app-region: no-drag;
      }
      #qv-input:focus { border-color: #1890ff; }
      #qv-input::placeholder { color: #666; }
      .qv-icon-btn {
        background: transparent; border: none; color: #999; cursor: pointer;
        width: 28px; height: 28px; border-radius: 4px; font-size: 14px;
        display: flex; align-items: center; justify-content: center;
      }
      .qv-icon-btn:hover { background: rgba(255,255,255,0.08); color: #e8e8ea; }
      .qv-send-btn {
        background: #1890ff; border: none; color: #fff; cursor: pointer;
        width: 28px; height: 28px; border-radius: 6px; font-size: 13px;
        display: flex; align-items: center; justify-content: center;
      }
      .qv-send-btn:hover { background: #40a9ff; }
      .qv-send-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

      /* 等待指示 */
      .qv-waiting {
        align-self: flex-start; padding: 6px 10px;
        color: #999; font-size: 11px;
        display: flex; align-items: center; gap: 4px;
      }
      .qv-waiting-dots::after {
        content: ''; animation: qv-dots 1.5s steps(3, end) infinite;
      }
      @keyframes qv-dots {
        0% { content: ''; } 33% { content: '.'; } 66% { content: '..'; } 100% { content: '...'; }
      }

      /* 通知面板 */
      #qv-notification-panel {
        display: none; position: absolute; top: 30px; right: 8px;
        width: 260px; max-height: 200px; overflow-y: auto;
        background: rgba(40,40,46,0.98); border: 1px solid rgba(255,255,255,0.12);
        border-radius: 6px; padding: 6px; z-index: 10;
      }
      #qv-notification-panel.visible { display: block; }
      .qv-notif-item {
        padding: 6px 8px; border-radius: 4px; cursor: pointer;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      .qv-notif-item:hover { background: rgba(255,255,255,0.06); }
      .qv-notif-item:last-child { border-bottom: none; }
      .qv-notif-type { font-size: 10px; color: #faad14; font-weight: 600; }
      .qv-notif-title { font-size: 11px; color: #e8e8ea; font-weight: 500; }
      .qv-notif-body { font-size: 10px; color: #999; line-height: 1.4; }

      /* 滚动条 */
      #qv-messages::-webkit-scrollbar { width: 4px; }
      #qv-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }
    </style>
  </head>
  <body>
    <div id="qv-root">
      <!-- 顶部栏 -->
      <header id="qv-header">
        <select id="qv-dept" class="qv-dept-select" title="选择部门">
          <option value="tech">技术部</option>
          <option value="hr">人力资源</option>
          <option value="finance">财务</option>
          <option value="sales">销售</option>
          <option value="admin">行政</option>
          <option value="cs">客服</option>
          <option value="legal">法务</option>
          <option value="ops">运营</option>
          <option value="core">核心</option>
        </select>
        <span id="qv-lock" class="qv-lock-icon" style="display:none" title="部门已锁定">🔒</span>
        <div class="qv-header-right">
          <span id="qv-notif-dot" class="qv-notification-dot" title="有新通知"></span>
          <button id="qv-notif-btn" class="qv-btn" title="通知" type="button">🔔</button>
          <button id="qv-close" class="qv-btn" title="关闭" type="button">✕</button>
        </div>
      </header>

      <!-- 通知面板 -->
      <div id="qv-notification-panel"></div>

      <!-- 消息区 -->
      <div id="qv-messages">
        <div class="qv-empty" id="qv-empty">按 Alt+Space 唤起 · 输入问题快速提问</div>
      </div>

      <!-- Trace 简要进度 -->
      <div id="qv-trace"></div>

      <!-- 输入区 -->
      <div id="qv-input-area">
        <div class="qv-attachments" id="qv-attachments"></div>
        <div class="qv-input-row">
          <button id="qv-screenshot-btn" class="qv-icon-btn" title="截图 (Ctrl+Shift+S)" type="button">📷</button>
          <input type="text" id="qv-input" placeholder="输入问题..." autocomplete="off" />
          <button id="qv-send" class="qv-send-btn" title="发送" type="button" disabled>➤</button>
        </div>
      </div>
    </div>
    <script src="./quick-view.js"></script>
  </body>
</html>
