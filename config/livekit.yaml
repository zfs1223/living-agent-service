# LiveKit Server 配置
# 局域网闭环部署,零外网依赖
# 改进项: P81(会议基础) / 闭环: 67 会议管理

port: 7880

logging:
  level: info
  json: false

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50300   # 101 个 UDP 端口(适配 Windows 容器端口映射)
  use_external_ip: false
  allow_tcp_fallback: true

redis:
  address: redis:6379

# API Key配置 - 必须使用正确的YAML格式
keys:
  las-livekit-api-key: las-livekit-api-secret-change-me

room:
  auto_create: true
  empty_timeout: 300
  departure_timeout: 30
  max_participants: 50

webhook:
  api_key: las-livekit-api-key
  urls:
    - http://living-agent-service:8382/api/livekit/webhook
